<article class="classroom-card">
    <div class="card-cover">
        <span class="cover-orb cover-orb--one" aria-hidden="true"></span>
        <span class="cover-orb cover-orb--two" aria-hidden="true"></span>
        <span class="students-chip">
            <span class="students-dot" aria-hidden="true"></span>
            {{ classroom().studentsCount }}
            {{ classroom().studentsCount === 1 ? 'studente' : 'studenti' }}
        </span>
    </div>

    <div class="card-content">
        <span class="card-initial" aria-hidden="true">{{ classroom().name.charAt(0) }}</span>
        <h5 class="card-name">{{ classroom().name }}</h5>

        <div class="teacher">
            <img class="teacher-avatar" [src]="classroom().createdBy.picture"
                [alt]="classroom().createdBy.firstName + ' ' + classroom().createdBy.lastName">
            <span class="teacher-name">
                {{ classroom().createdBy.firstName }} {{ classroom().createdBy.lastName }}
            </span>
        </div>
    </div>

    <div class="card-bottom">
        <span class="card-meta">Attività</span>
        <a [routerLink]="['/classroom', classroom().id, 'assignment']" class="btn btn-success btn-sm card-cta">
            Compiti
            <span class="cta-arrow" aria-hidden="true">→</span>
        </a>
    </div>
</article>
