<div class="classroom-card">
    <h5 class="fw-bold mb-1">{{ classroom().name }}</h5>
    <p class="text-muted mb-3">
        {{ classroom().createdBy.firstName }} {{ classroom().createdBy.lastName }}
    </p>

    <span class="badge rounded-pill text-bg-light border align-self-start mb-4">
        {{ classroom().studentsCount }} studenti
    </span>

    <button [routerLink]="['/classroom', classroom().id, 'assignment']" class="btn btn-success mt-auto align-self-end">
        Compiti
    </button>
</div>
