<div class="list-group-item d-flex justify-content-between align-items-center">
    <div>
        <h5 class="mb-1">{{ assignment().title }}</h5>
        <p class="mb-1 text-muted">
            Creata il {{ assignment().createdAt | date:'dd/MM/yyyy' }}
        </p>
        <p class="mb-0 text-muted">
            {{ assignment().completedCount }} / {{ assignment().studentsCount }} studenti hanno completato
        </p>
    </div>

    @if (isStudent()) {
    @if (assignment().completed) {
    <h5 class="mb-1">completato</h5>
    } @else {
    <button class="btn btn-primary" [disabled]="completing()" (click)="complete()">
        Segna come completata
    </button>
    }
    }
    @else {
    <button class="btn btn-primary" (click)="open()">
        Vedi chi ha completato
    </button>
    }
</div>
