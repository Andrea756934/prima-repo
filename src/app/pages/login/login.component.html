<div class="auth-page">
    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="auth-logo">C</div>
            <h1 class="h4 fw-bold mb-1">Bentornato</h1>
            <p class="text-muted mb-0">Accedi per vedere le tue classi</p>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="login()">
            <div class="mb-3">
                <label class="form-label fw-semibold small">Email</label>
                <input class="form-control form-control-lg" type="email" placeholder="nome@esempio.it"
                    formControlName="username">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold small">Password</label>
                <input class="form-control form-control-lg" type="password" placeholder="••••••••"
                    formControlName="password">
            </div>

            @if (errorMessage()) {
            <div class="alert alert-danger py-2 small">{{ errorMessage() }}</div>
            }

            <button [disabled]="loginForm.invalid" type="submit" class="btn btn-success btn-lg w-100 mt-2">
                Accedi
            </button>

            <button class="btn btn-link w-100 mt-3 text-decoration-none" type="button" routerLink="/register">
                Non hai un account? <span class="fw-semibold">Registrati</span>
            </button>
        </form>
    </div>
</div>
