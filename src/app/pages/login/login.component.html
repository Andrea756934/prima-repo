<div class="container mt-5">
    <div class="row">
        <div class="col col-lg-4"></div>

        <div class="col col-lg-4 col-md-12 border rounded p-4">
            <form [formGroup]="loginForm" (ngSubmit)="login()">
                <div class="form-outline mb-4">
                    <label class="form-label">Email</label>
                    <input class="form-control" type="email" formControlName="username">
                </div>

                <div class="form-outline mb-4">
                    <label class="form-label">Password</label>
                    <input class="form-control" type="password" formControlName="password">
                </div>
                <div class="text-danger">
                    {{ errorMessage() }}
                </div>

                <div class="text-center">
                    <button [disabled]="loginForm.invalid" type="submit" class="btn btn-primary btn-block mb-4">Sign
                        In
                    </button>

                    <button class="btn btn-link d-block mx-auto mt-2 text-decoration-none" type="button"
                        routerLink="/register">
                        Non hai un account? registrati adesso
                    </button>
                </div>
            </form>
        </div>
    </div>

</div>
