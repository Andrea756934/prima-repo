<app-nav-bar />

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-start mb-4">
        <div>
            <h2 class="fw-bold mb-0">Attività</h2>
            <p class="text-muted mb-0">Gli esercizi assegnati a questa classe</p>
        </div>

        <div class="d-flex align-items-start gap-2">
            <a class="btn btn-outline-secondary" [routerLink]="['/classroom']">
                Torna alle classi
            </a>

            @if (isteacher()) {
            <app-assignment-modal [classroomId]="classroomId()" (created)="fetch()" />
            }
        </div>
    </div>

    <div class="d-flex flex-column gap-3">
        @for (assignment of assignments(); track assignment.id) {
        <app-assignment-card [assignment]="assignment" [classroomId]="classroomId()"
            (assignmentUpdated)="assignmentUpdated($event)" />
        } @empty {
        <div class="empty-state">
            <h5 class="mb-1">Nessuna attività</h5>
            <p class="mb-0">Non ci sono ancora attività per questa classe.</p>
        </div>
        }
    </div>
</div>
