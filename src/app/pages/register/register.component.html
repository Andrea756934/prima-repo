<div class="auth-page">
    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="auth-logo">C</div>
            <h1 class="h4 fw-bold mb-1">Crea il tuo account</h1>
            <p class="text-muted mb-0">Bastano pochi secondi</p>
        </div>

        <form [formGroup]="registerForm" (ngSubmit)="register()">
            <div class="row g-3 mb-3">
                <div class="col-6">
                    <label class="form-label fw-semibold small">Nome</label>
                    <input class="form-control" type="text" formControlName="firstName">
                </div>
                <div class="col-6">
                    <label class="form-label fw-semibold small">Cognome</label>
                    <input class="form-control" type="text" formControlName="lastName">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold small">Ruolo</label>
                <select class="form-select" formControlName="role">
                    <option value="" disabled>Seleziona un ruolo</option>
                    <option value="student">Studente</option>
                    <option value="teacher">Docente</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold small">Immagine profilo (URL)</label>
                <input class="form-control" type="text" placeholder="https://..." formControlName="picture">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold small">Email</label>
                <input class="form-control" type="email" formControlName="username">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold small">Password</label>
                <input class="form-control" type="password" formControlName="password">
            </div>

            @if (errorMessage()) {
            <div class="alert alert-danger py-2 small">{{ errorMessage() }}</div>
            }

            <button [disabled]="registerForm.invalid" type="submit" class="btn btn-success btn-lg w-100 mt-2">
                Registrati
            </button>

            <button class="btn btn-link w-100 mt-3 text-decoration-none" type="button" routerLink="/login">
                Hai già un account? <span class="fw-semibold">Accedi</span>
            </button>
        </form>
    </div>
</div>
