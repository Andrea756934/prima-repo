<div class="container mt-5">
    <div class="row">
        <div class="col col-lg-4"></div>

        <div class="col col-lg-4 col-md-12 border rounded p-4">
            <form [formGroup]="registerForm" (ngSubmit)="register()">
                <div class="form-outline mb-4">
                    <label class="form-label">Nome</label>
                    <input class="form-control" type="text" formControlName="firstName">
                </div>

                <div class="form-outline mb-4">
                    <label class="form-label">Cognome</label>
                    <input class="form-control" type="text" formControlName="lastName">
                </div>

                <div class="form-outline mb-4">
                    <label class="form-label">Ruolo</label>
                    <select class="form-control" type="text" formControlName="role">
                        <option value="" disabled>Inserisci un ruolo</option>
                        <option value="student">Student</option>
                        <option value="teacher">Teacher</option>
                    </select>
                </div>

                <div class="form-outline mb-4">
                    <label class="form-label">Immagine profilo</label>
                    <input class="form-control" type="text" formControlName="picture">
                </div>

                <div class="form-outline mb-4">
                    <label class="form-label">Email</label>
                    <input class="form-control" type="email" formControlName="username">
                </div>

                <div class="form-outline mb-4">
                    <label class="form-label">Password</label>
                    <input class="form-control" type="password" formControlName="password">
                </div>

                <div class="text-danger">
                    {{ errorMessage() }}
                </div>

                <div class="text-center">
                    <button [disabled]="registerForm.invalid" type="submit" class="btn btn-primary btn-block mb-4">
                        register
                    </button>

                    <button class="btn btn-link d-block mx-auto mt-2 text-decoration-none" type="button"
                        routerLink="/login">
                        hai già un account? fai il login
                    </button>
                </div>
            </form>
        </div>
    </div>

</div>
